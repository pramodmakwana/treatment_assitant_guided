[project]
name = "copilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "pramodmakwana", email = "133479083+pramodmakwana@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "google-genai>=3.6.1",
    "langchain>=1.5.2",
    "langchain-google-genai>=4.5.2",
    "langchain-postgres>=0.0.19",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-postgres>=3.2.1",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "pypdf>=7.1.1",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
